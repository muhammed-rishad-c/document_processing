<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiquidLab Chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">
      <div id="header-title">
        <span id="brand-mark" aria-hidden="true"></span>
        <span> Assistant</span>
      </div>
      <button id="close-btn" aria-label="Close chat">✕</button>
    </div>

    <div id="messages"></div>

    <div id="input-row">
      <input type="text" id="query-input" placeholder="Ask about LiquidLab..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>

    <div id="feedback-overlay" class="hidden">
      <div id="feedback-box">
        <p>How was this conversation?</p>
        <div id="star-row">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
        <textarea id="feedback-comment" placeholder="Anything you'd like to add? (optional)"></textarea>
        <div id="feedback-actions">
          <button id="skip-btn">Skip</button>
          <button id="submit-feedback-btn">Submit</button>
        </div>
      </div>
    </div>

    <div id="ended-message" class="hidden">
      <div id="ended-check" aria-hidden="true">✓</div>
      <p>Thanks for chatting!</p>
      <p id="ended-subtext">We hope i could help.</p>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
