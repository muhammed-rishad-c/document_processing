<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Document Processing & RAG Chat Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --gemini-color: #8b5cf6;
            --gemini-hover: #7c3aed;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --user-msg-bg: #1e3a8a;
            --bot-msg-bg: #2e1065;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2, h3, h4 {
            color: var(--text-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        input[type="file"], input[type="text"], input[type="number"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem;
            border-radius: 6px;
            width: 100%;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-gemini {
            background-color: var(--gemini-color);
        }

        .btn-gemini:hover {
            background-color: var(--gemini-hover);
        }

        /* Conversational Chat Box Styles */
        .chat-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .chat-message {
            max-width: 80%;
            padding: 0.85rem 1.1rem;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid #2563eb;
            color: #ffffff;
        }

        .chat-message.assistant {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            border: 1px solid #6b21a8;
            color: #ffffff;
        }

        .chat-message .role-label {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--subtext-color);
            margin-bottom: 0.25rem;
        }

        .chunk-card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .chunk-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 0.5rem;
        }

        .score-badge {
            background-color: var(--success-color);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .document-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-pills {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--subtext-color);
        }

        .delete-btn {
            background-color: #ef4444;
            padding: 0.4rem 0.8rem;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        .session-info {
            font-size: 0.85rem;
            color: var(--subtext-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Document Engine & Gemini RAG</h1>

    <!-- 1. Upload Document Card -->
    <div class="card">
        <h2>1. Upload & Vector Processing</h2>
        <form id="uploadForm">
            <div class="form-group">
                <input type="file" id="fileInput" required>
                <button type="submit">Upload & Vectorize</button>
            </div>
        </form>
        <div id="uploadStatus"></div>
    </div>

    <!-- 2. Stateful Conversational RAG Chat Card -->
    <div class="card">
        <h2>2. Conversational Chat (RAG with Memory)</h2>
        
        <!-- Mode & Session Controls -->
        <div class="form-group">
            <select id="chatModeSelect" onchange="handleModeChange()">
                <option value="single">Option 1: Single Active Session</option>
                <option value="all">Option 2: All Sessions Combined (Global History)</option>
            </select>
            <button id="newSessionBtn" onclick="createNewSession()">➕ New Chat Session</button>
        </div>
        <div class="session-info" id="currentSessionDisplay" style="margin-bottom: 1rem;">
            Active Session: None (Click New Chat or Send a message)
        </div>

        <!-- Chat History Thread Box -->
        <div id="chatThread" class="chat-box">
            <div style="color: var(--subtext-color); text-align: center; margin: auto;">
                Start a session and enter a prompt to begin conversing.
            </div>
        </div>

        <div class="form-group">
            <input type="text" id="ragQuery" placeholder="Ask follow-up questions..." required>
            <input type="number" id="ragTopK" value="3" min="1" max="10" style="width: 80px;" title="Context Chunks Limit">
            <button class="btn-gemini" onclick="performStatefulChat()">Send ✨</button>
        </div>
        
        <!-- Sources Container -->
        <div id="ragSources" style="margin-top: 1rem;"></div>
    </div>

    <!-- 3. Semantic Vector Search Card -->
    <div class="card">
        <h2>3. Raw Chunk Vector Search</h2>
        <div class="form-group">
            <input type="text" id="searchQuery" placeholder="Search vector store for specific text..." required>
            <input type="number" id="topK" value="3" min="1" max="10" style="width: 80px;">
            <button onclick="performSearch()">Search Chunks</button>
        </div>
        <div id="searchResults" style="display: none;" class="chat-box"></div>
    </div>

    <!-- 4. Stored Documents Card -->
    <div class="card">
        <h2>4. Stored Documents</h2>
        <button onclick="loadDocuments()">Refresh Document List</button>
        <div id="documentList" style="margin-top: 1rem;"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:9000";
    let activeSessionId = null;

    // Handle Document Upload
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("fileInput");
        const statusDiv = document.getElementById("uploadStatus");

        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        statusDiv.innerHTML = "<p>Processing, chunking, and embedding document...</p>";

        try {
            const response = await fetch(`${API_BASE}/documents/upload`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<p style="color: var(--success-color);">${data.message} (ID: ${data.document_id}, Chunks: ${data.total_chunks})</p>`;
                loadDocuments();
            } else {
                statusDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.detail}</p>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<p style="color: #ef4444;">Upload failed: ${err.message}</p>`;
        }
    });

    // Handle Dropdown Selection Change
    function handleModeChange() {
        const mode = document.getElementById("chatModeSelect").value;
        const newBtn = document.getElementById("newSessionBtn");
        const display = document.getElementById("currentSessionDisplay");
        const threadDiv = document.getElementById("chatThread");
        
        threadDiv.innerHTML = "";
        document.getElementById("ragSources").innerHTML = "";

        if (mode === "all") {
            newBtn.style.display = "none";
            display.innerText = "Mode: All Sessions Combined (Retrieving context across all saved sessions)";
            loadAllSessionsMessages();
        } else {
            newBtn.style.display = "inline-block";
            if (activeSessionId) {
                display.innerText = `Active Session: ${activeSessionId}`;
                loadSessionMessages(activeSessionId);
            } else {
                display.innerText = "Active Session: None (Click New Chat)";
                threadDiv.innerHTML = `<div style="color: var(--subtext-color); text-align: center; margin: auto;">Start a session and enter a prompt to begin conversing.</div>`;
            }
        }
    }

    // 1. Create a New Session (Single Mode)
    async function createNewSession() {
        try {
            const response = await fetch(`${API_BASE}/chats`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: `Session ${new Date().toLocaleTimeString()}` })
            });

            if (response.ok) {
                const data = await response.json();
                activeSessionId = data.id;
                document.getElementById("currentSessionDisplay").innerText = `Active Session: ${activeSessionId}`;
                document.getElementById("chatThread").innerHTML = "";
                document.getElementById("ragSources").innerHTML = "";
            } else {
                alert("Failed to create chat session.");
            }
        } catch (err) {
            alert("Error creating session: " + err.message);
        }
    }

    // Load Single Session Messages
    async function loadSessionMessages(sessionId) {
        try {
            const response = await fetch(`${API_BASE}/chats/${sessionId}/messages`);
            if (response.ok) {
                const messages = await response.json();
                const threadDiv = document.getElementById("chatThread");
                threadDiv.innerHTML = "";

                messages.forEach(msg => {
                    appendMessageToThread(msg.role, msg.content);
                });
            }
        } catch (err) {
            console.error("Failed to load chat history", err);
        }
    }

    // Load Combined Messages from All Sessions
    async function loadAllSessionsMessages() {
        try {
            const response = await fetch(`${API_BASE}/chats/messages/all`);
            if (response.ok) {
                const messages = await response.json();
                const threadDiv = document.getElementById("chatThread");
                threadDiv.innerHTML = "";

                if (messages.length === 0) {
                    threadDiv.innerHTML = `<div style="color: var(--subtext-color); text-align: center; margin: auto;">No previous messages found across any session.</div>`;
                    return;
                }

                messages.forEach(msg => {
                    appendMessageToThread(msg.role, msg.content, msg.session_id);
                });
            }
        } catch (err) {
            console.error("Failed to load all sessions history", err);
        }
    }

    function appendMessageToThread(role, text, sessionId = null) {
        const threadDiv = document.getElementById("chatThread");
        const msgDiv = document.createElement("div");
        msgDiv.className = `chat-message ${role}`;

        const labelDiv = document.createElement("div");
        labelDiv.className = "role-label";
        
        let labelText = role === "user" ? "You" : "Chatbot";
        if (sessionId) {
            labelText += ` (Session: ${sessionId})`;
        }
        labelDiv.innerText = labelText;

        const contentDiv = document.createElement("div");
        contentDiv.innerHTML = text.replace(/\n/g, "<br>");

        msgDiv.appendChild(labelDiv);
        msgDiv.appendChild(contentDiv);
        threadDiv.appendChild(msgDiv);

        threadDiv.scrollTop = threadDiv.scrollHeight;
    }

    // Perform Stateful RAG Chat
    async function performStatefulChat() {
        const queryInput = document.getElementById("ragQuery");
        const query = queryInput.value.trim();
        const topK = parseInt(document.getElementById("ragTopK").value);
        const sourcesDiv = document.getElementById("ragSources");
        const mode = document.getElementById("chatModeSelect").value;

        if (!query) return;

        if (mode === "single" && !activeSessionId) {
            await createNewSession();
        }

        appendMessageToThread("user", query, mode === "all" ? "Combined" : null);
        queryInput.value = "";

        const payload = {
            query: query,
            top_k: topK,
            mode: mode
        };

        if (mode === "single") {
            payload.session_id = activeSessionId;
        }

        try {
            const response = await fetch(`${API_BASE}/documents/chat-memory`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                appendMessageToThread("assistant", data.answer, mode === "all" ? "Combined" : null);

                let sourcesHtml = `<h4>Reference Sources (${data.sources.length}):</h4>`;
                data.sources.forEach(src => {
                    sourcesHtml += `
                        <div class="chunk-card">
                            <div class="chunk-meta">
                                <span>Doc ID: ${src.document_id} (Chunk #${src.chunk_index})</span>
                                <span class="score-badge">Score: ${src.similarity_score}</span>
                            </div>
                        </div>
                    `;
                });
                sourcesDiv.innerHTML = sourcesHtml;
            } else {
                appendMessageToThread("assistant", `❌ Error: ${data.detail}`);
            }
        } catch (err) {
            appendMessageToThread("assistant", `❌ Request failed: ${err.message}`);
        }
    }

    // Handle Semantic Search
    async function performSearch() {
        const query = document.getElementById("searchQuery").value.trim();
        const topK = parseInt(document.getElementById("topK").value);
        const resultsDiv = document.getElementById("searchResults");

        if (!query) return;

        resultsDiv.style.display = "block";
        resultsDiv.innerHTML = "<p>Searching Qdrant vector store...</p>";

        try {
            const response = await fetch(`${API_BASE}/documents/search`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query, top_k: topK })
            });

            const data = await response.json();

            if (response.ok && data.results.length > 0) {
                resultsDiv.innerHTML = `<h3>Results for "${data.query}"</h3>`;
                data.results.forEach(res => {
                    resultsDiv.innerHTML += `
                        <div class="chunk-card">
                            <div class="chunk-meta">
                                <span>Doc ID: ${res.document_id} (Chunk #${res.chunk_index})</span>
                                <span class="score-badge">Score: ${res.similarity_score}</span>
                            </div>
                            <div>"${res.chunk_text}"</div>
                        </div>
                    `;
                });
            } else if (data.results.length === 0) {
                resultsDiv.innerHTML = "<p>No matching text chunks found.</p>";
            } else {
                resultsDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.detail}</p>`;
            }
        } catch (err) {
            resultsDiv.innerHTML = `<p style="color: #ef4444;">Search request failed: ${err.message}</p>`;
        }
    }

    // Load Document List
    async function loadDocuments() {
        const listDiv = document.getElementById("documentList");
        try {
            const response = await fetch(`${API_BASE}/documents`);
            const docs = await response.json();

            if (docs.length === 0) {
                listDiv.innerHTML = "<p>No documents stored in database.</p>";
                return;
            }

            listDiv.innerHTML = docs.map(doc => {
                const stats = doc.stats || {};
                const words = stats.total_words ?? 0;
                const chars = stats.total_characters ?? 0;
                const sentences = stats.total_sentences ?? 0;
                const paragraphs = stats.total_paragraphs ?? 0;

                return `
                    <div class="document-list-item">
                        <div>
                            <strong>${doc.filename}</strong> (${doc.file_type})<br>
                            <small style="color: var(--subtext-color);">ID: ${doc.id}</small>
                            <div class="stats-pills">
                                <span class="stat-pill">📝 Words: ${words}</span>
                                <span class="stat-pill">🔤 Chars: ${chars}</span>
                                <span class="stat-pill">💬 Sentences: ${sentences}</span>
                                <span class="stat-pill">📄 Paragraphs: ${paragraphs}</span>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteDocument('${doc.id}')">Delete</button>
                    </div>
                `;
            }).join("");
        } catch (err) {
            listDiv.innerHTML = `<p style="color: #ef4444;">Failed to load documents.</p>`;
        }
    }

    // Delete Document
    async function deleteDocument(docId) {
        if (!confirm("Are you sure you want to delete this document from DB & Qdrant?")) return;

        try {
            const response = await fetch(`${API_BASE}/documents/${docId}`, { method: "DELETE" });
            if (response.ok) {
                loadDocuments();
            }
        } catch (err) {
            alert("Delete failed: " + err.message);
        }
    }

    // Initial Load
    loadDocuments();
</script>

</body>
</html>
