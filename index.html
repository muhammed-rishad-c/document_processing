<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Document Processing & RAG Chat Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --gemini-color: #8b5cf6;
            --gemini-hover: #7c3aed;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            color: var(--text-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        input[type="file"], input[type="text"], input[type="number"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem;
            border-radius: 6px;
            width: 100%;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-gemini {
            background-color: var(--gemini-color);
        }

        .btn-gemini:hover {
            background-color: var(--gemini-hover);
        }

        .results-box {
            margin-top: 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
        }

        .ai-answer-card {
            background-color: #2e1065;
            border: 1px solid #6b21a8;
            border-left: 5px solid var(--gemini-color);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 6px;
            line-height: 1.6;
        }

        .chunk-card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        .chunk-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 0.5rem;
        }

        .score-badge {
            background-color: var(--success-color);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .document-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-pills {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--subtext-color);
        }

        .delete-btn {
            background-color: #ef4444;
            padding: 0.4rem 0.8rem;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Document Engine & Gemini RAG</h1>

    <!-- 1. Upload Document Card -->
    <div class="card">
        <h2>1. Upload & Vector Processing</h2>
        <form id="uploadForm">
            <div class="form-group">
                <input type="file" id="fileInput" required>
                <button type="submit">Upload & Vectorize</button>
            </div>
        </form>
        <div id="uploadStatus"></div>
    </div>

    <!-- 2. Gemini RAG Question Answering Card -->
    <div class="card">
        <h2>2. Ask AI (Gemini RAG)</h2>
        <div class="form-group">
            <input type="text" id="ragQuery" placeholder="Ask a question about your uploaded documents..." required>
            <input type="number" id="ragTopK" value="3" min="1" max="10" style="width: 80px;" title="Context Chunks Limit">
            <button class="btn-gemini" onclick="performRAGChat()">Ask Gemini ✨</button>
        </div>
        <div id="ragResults" class="results-box" style="display: none;"></div>
    </div>

    <!-- 3. Semantic Vector Search Card -->
    <div class="card">
        <h2>3. Raw Chunk Vector Search</h2>
        <div class="form-group">
            <input type="text" id="searchQuery" placeholder="Search vector store for specific text..." required>
            <input type="number" id="topK" value="3" min="1" max="10" style="width: 80px;">
            <button onclick="performSearch()">Search Chunks</button>
        </div>
        <div id="searchResults" class="results-box" style="display: none;"></div>
    </div>

    <!-- 4. Stored Documents Card -->
    <div class="card">
        <h2>4. Stored Documents</h2>
        <button onclick="loadDocuments()">Refresh Document List</button>
        <div id="documentList" style="margin-top: 1rem;"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:9000";

    // Handle Document Upload
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("fileInput");
        const statusDiv = document.getElementById("uploadStatus");

        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        statusDiv.innerHTML = "<p>Processing, chunking, and embedding document...</p>";

        try {
            const response = await fetch(`${API_BASE}/documents/upload`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<p style="color: var(--success-color);">${data.message} (ID: ${data.document_id}, Chunks: ${data.total_chunks})</p>`;
                loadDocuments();
            } else {
                statusDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.detail}</p>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<p style="color: #ef4444;">Upload failed: ${err.message}</p>`;
        }
    });

    // Handle Gemini RAG Chat
    async function performRAGChat() {
        const query = document.getElementById("ragQuery").value.trim();
        const topK = parseInt(document.getElementById("ragTopK").value);
        const resultsDiv = document.getElementById("ragResults");

        if (!query) return;

        resultsDiv.style.display = "block";
        resultsDiv.innerHTML = "<p>🔍 Retrieving vector chunks & generating response with Gemini...</p>";

        try {
            const response = await fetch(`${API_BASE}/documents/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query, top_k: topK })
            });

            const data = await response.json();

            if (response.ok) {
                let htmlContent = `
                    <div class="ai-answer-card">
                        <h3 style="margin-top: 0; color: #c084fc;">🤖 Gemini Answer:</h3>
                        <div>${data.answer.replace(/\n/g, '<br>')}</div>
                    </div>
                    <h3>Reference Sources Used (${data.sources.length}):</h3>
                `;

                data.sources.forEach(src => {
                    htmlContent += `
                        <div class="chunk-card">
                            <div class="chunk-meta">
                                <span>Doc ID: ${src.document_id} (Chunk #${src.chunk_index})</span>
                                <span class="score-badge">Score: ${src.similarity_score}</span>
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = htmlContent;
            } else {
                resultsDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.detail}</p>`;
            }
        } catch (err) {
            resultsDiv.innerHTML = `<p style="color: #ef4444;">RAG Chat failed: ${err.message}</p>`;
        }
    }

    // Handle Semantic Search
    async function performSearch() {
        const query = document.getElementById("searchQuery").value.trim();
        const topK = parseInt(document.getElementById("topK").value);
        const resultsDiv = document.getElementById("searchResults");

        if (!query) return;

        resultsDiv.style.display = "block";
        resultsDiv.innerHTML = "<p>Searching Qdrant vector store...</p>";

        try {
            const response = await fetch(`${API_BASE}/documents/search`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query, top_k: topK })
            });

            const data = await response.json();

            if (response.ok && data.results.length > 0) {
                resultsDiv.innerHTML = `<h3>Results for "${data.query}"</h3>`;
                data.results.forEach(res => {
                    resultsDiv.innerHTML += `
                        <div class="chunk-card">
                            <div class="chunk-meta">
                                <span>Doc ID: ${res.document_id} (Chunk #${res.chunk_index})</span>
                                <span class="score-badge">Score: ${res.similarity_score}</span>
                            </div>
                            <div>"${res.chunk_text}"</div>
                        </div>
                    `;
                });
            } else if (data.results.length === 0) {
                resultsDiv.innerHTML = "<p>No matching text chunks found.</p>";
            } else {
                resultsDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.detail}</p>`;
            }
        } catch (err) {
            resultsDiv.innerHTML = `<p style="color: #ef4444;">Search request failed: ${err.message}</p>`;
        }
    }

    // Load Document List
    async function loadDocuments() {
        const listDiv = document.getElementById("documentList");
        try {
            const response = await fetch(`${API_BASE}/documents`);
            const docs = await response.json();

            if (docs.length === 0) {
                listDiv.innerHTML = "<p>No documents stored in database.</p>";
                return;
            }

            listDiv.innerHTML = docs.map(doc => {
                const stats = doc.stats || {};
                const words = stats.total_words ?? 0;
                const chars = stats.total_characters ?? 0;
                const sentences = stats.total_sentences ?? 0;
                const paragraphs = stats.total_paragraphs ?? 0;

                return `
                    <div class="document-list-item">
                        <div>
                            <strong>${doc.filename}</strong> (${doc.file_type})<br>
                            <small style="color: var(--subtext-color);">ID: ${doc.id}</small>
                            <div class="stats-pills">
                                <span class="stat-pill">📝 Words: ${words}</span>
                                <span class="stat-pill">🔤 Chars: ${chars}</span>
                                <span class="stat-pill">💬 Sentences: ${sentences}</span>
                                <span class="stat-pill">📄 Paragraphs: ${paragraphs}</span>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteDocument('${doc.id}')">Delete</button>
                    </div>
                `;
            }).join("");
        } catch (err) {
            listDiv.innerHTML = `<p style="color: #ef4444;">Failed to load documents.</p>`;
        }
    }

    // Delete Document
    async function deleteDocument(docId) {
        if (!confirm("Are you sure you want to delete this document from DB & Qdrant?")) return;

        try {
            const response = await fetch(`${API_BASE}/documents/${docId}`, { method: "DELETE" });
            if (response.ok) {
                loadDocuments();
            }
        } catch (err) {
            alert("Delete failed: " + err.message);
        }
    }

    // Initial Load
    loadDocuments();
</script>

</body>
</html>
